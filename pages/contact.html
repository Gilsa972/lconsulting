<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Contact — L'Consulting</title>
    <link rel="stylesheet" href="../assets/css/style.css" />
</head>

<body>

    <!-- HEADER -->
    <header class="site-header">
        <div class="container">
            <h1 class="brand">L'Consulting</h1>
            <nav aria-label="Navigation principale">
                <a href="../index.html">Accueil</a>
                <a href="services.html">Services</a>
                <a href="formules.html">Formules</a>
                <a href="tarifs.html">Tarifs</a>
                <a href="contact.html" class="active">Contact</a>
            </nav>
        </div>
    </header>

    <!-- MAIN -->
    <main class="container">
        <section id="contact">
            <h2>Contactez-nous</h2>
            <p>
                Une question, un devis ou besoin d'un accompagnement ?  
                Remplissez le formulaire ci-dessous et je reviens vers vous rapidement.
            </p>

            <form class="contact-form">
                <label for="name">Nom complet</label>
                <input type="text" id="name" placeholder="Votre nom" required>

                <label for="email">Adresse e-mail</label>
                <input type="email" id="email" placeholder="Votre e-mail" required>

                <label for="message">Message</label>
                <textarea id="message" rows="6" placeholder="Votre message..." required></textarea>

                <button type="submit" class="btn">Envoyer le message</button>
            </form>
        </section>
    </main>

    <footer class="site-footer container">
        <p>© 2025 L’Consulting — 
            <a href="pages/mentions-legales.html" class="footer-link">Mentions légales</a>
        </p>
    </footer>

    <script src="../assets/js/script.js"></script>
</body>
</html>
